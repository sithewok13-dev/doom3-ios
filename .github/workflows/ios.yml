# Builds the DOOM 3 app for iOS (arm64 device): dhewm3 with the OpenGL ES
# renderer, both games (DOOM 3 and Resurrection of Evil) in one app, with
# LibreCoop's co-op for each (librecoop/), and
# packages it as an UNSIGNED .ipa (ad-hoc signature only), kept as a workflow
# artifact. Sideload it (SideStore, Feather) or hand it to ios-pipeline's
# testflight-ipa.yml for TestFlight.
#
# Where the .ipa goes (as in the owner's Serious Sam port):
#   - a push to ios, or a manual run of ios with "release" left empty: the
#     public "ios-latest" prerelease (never marked latest), replaced each time.
#   - a manual run of branch ios with "release" set to a tag such as ios-v0.1
#     (gh workflow run ios.yml --ref ios -f release=ios-v0.1): a release for
#     that tag, created at the commit being built, with docs/ios/RELEASE_NOTES.md
#     from that commit as its text and only the files in RELEASE_IPAS
#     attached, marked as the latest release. A version with a '-' in it
#     (ios-v0.2-beta1) is a prerelease instead and isn't marked latest.
#     ios-latest is left alone. The run stops before building if the tag isn't
#     ios-v<version>, is already on another commit, or the notes have no
#     "### What's in <tag>" line. Running it again for the same tag on the
#     same commit updates that release. Afterwards the release is added to the
#     AltStore / SideStore source (altsource.json, committed to ios).
#
# No game data is built in or bundled: the app reads base/ and d3xp/ from its
# Documents folder (Files > On My iPhone > DOOM 3). The package step fails if
# a .pk4 ever ends up in the app, and the release job checks the .ipa again.
name: iOS

on:
  push:
    branches: [ios]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      # (the AltStore / SideStore source, which a release run commits)
      - 'altsource.json'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest as usual.
        required: false
        default: ''

# a newer push waits for the running build (rather than cancelling a long
# ANGLE build); a build still waiting is replaced by the newest. A release
# run has a group of its own (per tag), so a push doesn't replace it.
concurrency:
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: false

# Read-only by default; only the publishing jobs can write.
permissions:
  contents: read

env:
  # Must match between ANGLE and the app: dyld refuses to load a framework
  # built for a newer iOS than the phone's.
  IOS_DEPLOYMENT_TARGET: '18.0'
  # ANGLE (OpenGL ES on Metal), built here and cached; the same revision the
  # Jedi Knight port ships: branch chromium/8060 (Sept 15 2026), from the
  # github.com/google/angle mirror. To rebuild, change ANGLE_REV or bump
  # ANGLE_CACHE_VERSION.
  ANGLE_REV: 4b7308a36376199c095ccb0ab69b773daa8b9fbe
  ANGLE_CACHE_VERSION: v1
  # The tag a manual run was asked to release; empty for pushes and ordinary runs.
  RELEASE_TAG: ${{ inputs.release }}
  # The .ipa files a release gets, space-separated (one app, both games).
  RELEASE_IPAS: DOOM3-iOS-unsigned.ipa
  # Release title; the tag's version is added after it (ios-v0.1 -> "... v0.1").
  RELEASE_TITLE: "DOOM 3 for iOS"

jobs:
  build:
    name: DOOM 3
    runs-on: macos-15
    # ANGLE's first (uncached) build is long
    timeout-minutes: 330
    outputs:
      build_number: ${{ steps.package.outputs.build_number }}
      build_date: ${{ steps.package.outputs.build_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the long build: a release needs a usable tag and notes written
      # for it.
      - name: Check release tag and notes
        if: env.RELEASE_TAG != ''
        run: |
          set -e
          if [ "$GITHUB_REF" != "refs/heads/ios" ]; then
            echo "::error::Releases are made from branch ios (this run is on $GITHUB_REF)."
            exit 1
          fi
          case "$RELEASE_TAG" in
            ios-v*) ;;
            *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
          esac
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
            exit 1
          fi
          # A tag already there must be on this commit, or the release's .ipa and
          # its tag's source would differ (publishing doesn't move a tag).
          REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
            exit 1
          fi
          if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
            echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
            exit 1
          fi

      # App Store Connect wants a current SDK, so take the newest release Xcode
      # on the runner rather than its default.
      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          which ninja || brew install ninja

      # ANGLE is built with Chromium's own tools (depot_tools, gn), as in the
      # Jedi Knight port's workflow: slow the first time, then cached.
      - name: Restore ANGLE
        id: angle
        uses: actions/cache/restore@v4
        with:
          path: angle-prebuilt
          key: angle-ios-arm64-${{ env.ANGLE_REV }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}-${{ env.ANGLE_CACHE_VERSION }}

      - name: Free disk space for ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Build ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        run: |
          set -ex
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"

          mkdir -p "$RUNNER_TEMP/angle" && cd "$RUNNER_TEMP/angle"
          git init -q
          git fetch --depth 1 https://github.com/google/angle "$ANGLE_REV"
          git checkout -q FETCH_HEAD

          # an unmanaged solution rooted at this checkout, for iOS, without
          # the (large, unneeded) Dawn/WebGPU dependencies
          cat > .gclient <<'GCLIENT'
          solutions = [
            {
              "name": ".",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_angle_dawn_deps": False,
              },
            },
          ]
          target_os = ["ios"]
          GCLIENT

          gclient sync --no-history --shallow -j8
          gn gen out/ios --args="
            is_debug=false
            is_component_build=false
            symbol_level=0
            target_os=\"ios\"
            target_cpu=\"arm64\"
            target_environment=\"device\"
            ios_deployment_target=\"$IOS_DEPLOYMENT_TARGET\"
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_swiftshader=false
            angle_enable_wgpu=false
            angle_build_tests=false
          "
          autoninja -C out/ios libEGL libGLESv2

          # keep only what the build needs: include/ and the two frameworks
          DEST="$GITHUB_WORKSPACE/angle-prebuilt"
          mkdir -p "$DEST/out/ios"
          cp -R include "$DEST/include"
          cp -R out/ios/libEGL.framework out/ios/libGLESv2.framework "$DEST/out/ios/"

      # saved at once, so a failure later in the job doesn't lose the slow build
      - name: Save ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: angle-prebuilt
          key: ${{ steps.angle.outputs.cache-primary-key }}

      - name: Show ANGLE
        run: |
          for f in libEGL libGLESv2; do
            file "angle-prebuilt/out/ios/$f.framework/$f"
            otool -l "angle-prebuilt/out/ios/$f.framework/$f" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos' || true
          done

      # SDL3 and OpenAL Soft, built for iOS by ios/build-deps.sh (a few
      # minutes); later runs restore them from the cache.
      # (restore and save are separate steps so the dependencies are kept as
      # soon as they're built, even when the app's build then fails)
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build-ios-deps
          key: ios-deps-${{ steps.xcode.outputs.version }}-${{ env.IOS_DEPLOYMENT_TARGET }}-${{ hashFiles('ios/build-deps.sh', 'ios/toolchain.cmake') }}

      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ios/build-deps.sh "$PWD/build-ios-deps"

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-ios-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build
        run: |
          DEPS="$PWD/build-ios-deps"
          set +e
          {
            cmake -S dhewm3/neo -B build-ios -G Ninja \
              --toolchain "$PWD/ios/toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$DEPS" -DCMAKE_FIND_ROOT_PATH="$DEPS" \
              -DANGLE_ROOT="$PWD/angle-prebuilt" \
              -DIOS_BUILD_NUMBER="${{ github.run_number }}" &&
            cmake --build build-ios -- -k 0   # (every error at once, not just the first)
          } > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            # The first errors, as annotations, so they show on the run page.
            grep -E '(^|: )(fatal )?error: |CMake Error' build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line#$GITHUB_WORKSPACE/}"
            done
            echo "---- errors ----"
            grep -n -i -E 'error[: ]|^ld: |undefined symbol|CMake Error' build.log | head -80
            echo "---- end of log ----"
            tail -60 build.log
            exit $status
          fi
          tail -5 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package .ipa
        id: package
        run: |
          APP=build-ios/DOOM3.app
          test -d "$APP"
          # The build stamp under MENU's tray ("build 80 · Nov 9"): the run
          # number (CFBundleVersion is already it) and the UTC date
          BUILD_DATE=$(date -u +%Y-%m-%d)
          /usr/libexec/PlistBuddy -c "Add :SWBuildNumber string ${{ github.run_number }}" -c "Add :SWBuildDate string $BUILD_DATE" "$APP/Info.plist"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          # Game data must never be bundled.
          if find "$APP" -iname '*.pk4' | grep -q .; then
            echo "::error::Game data (.pk4) found in the app bundle"
            exit 1
          fi
          # LibreCoop's mod folders: only its own defs, scripts and strings
          for z in "$APP"/Mods/*/pak000.zip; do
            unzip -Z1 "$z"
            if unzip -Z1 "$z" | grep -qvE '^(def|script|strings)(/|$)'; then
              echo "::error::Something other than LibreCoop's defs, scripts and strings in $z"
              exit 1
            fi
          done
          # ANGLE's frameworks first, then the app around them
          for f in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DOOM3-iOS-unsigned.ipa Payload
          plutil -p Payload/DOOM3.app/Info.plist | grep -E 'CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion|SWBuild|MinimumOSVersion|CFBundleIcons'
          lipo -info Payload/DOOM3.app/DOOM3
          # ANGLE is linked and bundled, Apple's OpenGL ES isn't
          otool -L Payload/DOOM3.app/DOOM3 | grep -E 'libEGL|libGLESv2'
          ! otool -L Payload/DOOM3.app/DOOM3 | grep -q OpenGLES
          ls Payload/DOOM3.app/Frameworks
          # both games' code is in (and nothing else of theirs is visible)
          nm -g Payload/DOOM3.app/DOOM3 | grep -E 'GetGameAPI_(base|d3xp)$'
          # and LibreCoop's co-op for each
          nm -g Payload/DOOM3.app/DOOM3 | grep -E 'GetGameAPI_librecoop(d3xp)?$'
          ls -l DOOM3-iOS-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DOOM3-iOS-unsigned.ipa
          path: DOOM3-iOS-unsigned.ipa
          if-no-files-found: error

  # Every push to ios (and a manual run of ios without "release"): the public
  # "ios-latest" prerelease, never marked Latest, with this build's .ipa. Its
  # body's first line is the build stamp, which the builds page reads.
  latest:
    name: Publish to "ios-latest" release
    if: github.ref == 'refs/heads/ios' && !inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ios-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DOOM3-iOS-unsigned.ipa

      - name: Check for game data
        run: |
          ls -l DOOM3-iOS-unsigned.ipa
          if unzip -Z1 DOOM3-iOS-unsigned.ipa | grep -iE '\.(pk4|pk3)$'; then
            echo "::error::Game data in the .ipa"
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          target_commitish: ${{ github.sha }}
          name: iOS latest build
          prerelease: true
          make_latest: false
          body: |
            Build ${{ needs.build.outputs.build_number }} · ${{ needs.build.outputs.build_date }}
            Test build of DOOM 3 for iOS, rebuilt on every push to the ios branch. Game files are not included.
          files: DOOM3-iOS-unsigned.ipa
          fail_on_unmatched_files: true

  # A manual run of ios with "release" set: a release for that tag, at the
  # commit built, with docs/ios/RELEASE_NOTES.md as its text and only the
  # .ipa files in RELEASE_IPAS. ios-latest is left alone.
  release:
    name: Publish release ${{ inputs.release }}
    if: github.ref == 'refs/heads/ios' && inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the notes and the AltStore source script, from the commit just built
      # (kept first, as checkout empties the folder it checks out into)
      - name: Get release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/ios/RELEASE_NOTES.md
            ios/update_altsource.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: DOOM3-iOS-unsigned.ipa
          path: out

      # No game files, ever: no DOOM 3 data file in the .ipa, and nothing in
      # LibreCoop's mod packs but its own defs, scripts and strings.
      - name: Check for game data
        run: |
          set -e
          ls -l out
          for ipa in out/*.ipa; do
            if unzip -Z1 "$ipa" | grep -iE '\.(pk4|pk3|roq|ogg|wav|tga|dds|md5mesh|md5anim|md5camera|lwo|ase|map|proc|cm|aas[0-9a-z]*)$'; then
              echo "::error::Game data in $ipa"
              exit 1
            fi
            rm -rf chk && mkdir chk && unzip -q "$ipa" -d chk
            for z in chk/Payload/*.app/Mods/*/pak000.zip; do
              [ -e "$z" ] || continue
              if unzip -Z1 "$z" | grep -vE '^(def|script|strings)(/|$)'; then
                echo "::error::Something other than LibreCoop's defs, scripts and strings in $z"
                exit 1
              fi
            done
            rm -rf chk
          done

      # Only the files in RELEASE_IPAS, the title, whether it's a prerelease
      # (a '-' in the version, after the "ios-"), and the text: the build
      # stamp, then the notes.
      - name: Prepare release
        id: rel
        run: |
          set -e
          if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
            echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
            exit 1
          fi
          mkdir release
          for ipa in $RELEASE_IPAS; do
            if [ ! -f "out/$ipa" ]; then
              echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
              exit 1
            fi
            cp "out/$ipa" release/
          done
          ls -la release
          VERSION=${RELEASE_TAG#ios-}
          case "$VERSION" in
            *-*) PRERELEASE=true; LATEST=false ;;
            *) PRERELEASE=false; LATEST=true ;;
          esac
          echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
          { echo "Build ${{ needs.build.outputs.build_number }} · ${{ needs.build.outputs.build_date }}"; echo; cat docs/ios/RELEASE_NOTES.md; } > release-notes.md
          {
            echo "name=$RELEASE_TITLE $VERSION"
            echo "prerelease=$PRERELEASE"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release for the tag
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at the commit this run built (left out, GitHub
          # would put a new tag on the default branch, main)
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: ${{ steps.rel.outputs.latest }}
          files: release/*.ipa
          fail_on_unmatched_files: true

      # The AltStore / SideStore source (altsource.json, the one
      # https://raw.githubusercontent.com/<repo>/ios/altsource.json serves)
      # gets the release just published: version, build, size, SHA-256,
      # date, download link and a summary of the notes
      # (ios/update_altsource.py), committed to the ios branch. An entry that
      # pointed at the ios-latest test build is dropped. The commit is made
      # with GITHUB_TOKEN, which starts no workflow run (and is marked
      # [skip ci]), so it doesn't rebuild ios-latest. continue-on-error: if
      # anything here fails, the release (already out) still counts.
      - name: Add the release to the AltStore / SideStore source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ios
        run: |
          set -euo pipefail
          trap 'echo "::warning::The AltStore / SideStore source was not updated for ${RELEASE_TAG}. The release itself is published; add it to altsource.json by hand (python3 ios/update_altsource.py)."' ERR
          SRC="$RUNNER_TEMP/altsource"
          rm -rf "$SRC"
          git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SRC"
          git -C "$SRC" config user.name "github-actions[bot]"
          git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IPAS=()
          for ipa in $RELEASE_IPAS; do IPAS+=(--ipa "release/$ipa"); done
          for attempt in 1 2 3; do
            # The script and the notes come from the commit just built; the
            # source file from the newest ios branch
            python3 -I ios/update_altsource.py --source "$SRC/altsource.json" \
              --tag "$RELEASE_TAG" --notes docs/ios/RELEASE_NOTES.md "${IPAS[@]}"
            if git -C "$SRC" diff --quiet; then
              echo "The source already has ${RELEASE_TAG}"
              break
            fi
            git -C "$SRC" commit --quiet -am "iOS: add ${RELEASE_TAG} to the AltStore / SideStore source [skip ci]"
            if git -C "$SRC" push --quiet origin "HEAD:${SOURCE_BRANCH}"; then
              echo "Added ${RELEASE_TAG} to the source on ${SOURCE_BRANCH}"
              break
            fi
            if [ "$attempt" = 3 ]; then
              false # gives up (the warning above)
            fi
            # Someone pushed in between: start again from the new branch head
            git -C "$SRC" fetch --quiet --depth 1 origin "$SOURCE_BRANCH"
            git -C "$SRC" reset --quiet --hard FETCH_HEAD
          done
          rm -rf "$SRC"
